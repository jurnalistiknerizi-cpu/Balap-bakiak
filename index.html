<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balap Bakiak 3D</title>
<style>
:root{--card:#fff;--tx:#12202b;--mut:#5b6b78;--opt:#eef2f6;--bg:#10202b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1b2a36;--tx:#eef3f7;--mut:#9fb0bd;--opt:#27394a}}
:root[data-theme="dark"]{--card:#1b2a36;--tx:#eef3f7;--mut:#9fb0bd;--opt:#27394a}
html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#cv{flex:1;min-height:0;position:relative}
#c{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.box{pointer-events:auto;background:var(--card);color:var(--tx);padding:16px 18px;border-radius:16px;max-width:340px;max-height:94%;overflow:auto;text-align:center;box-shadow:0 8px 30px #0006}
.box h2{margin:0 0 6px;font-size:20px}.box p{margin:0 0 12px;font-size:13px;color:var(--mut);line-height:1.4}
#cap{position:absolute;left:8px;right:52px;top:8px;background:#000a;color:#fff;padding:8px 10px;border-radius:12px;font-size:13px;line-height:1.35;opacity:0;transition:opacity .3s;pointer-events:none}#mt{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:18px}.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tm input{width:100%;box-sizing:border-box;margin:2px 0;padding:6px 8px;font-size:16px;border:0;border-radius:8px;background:var(--opt);color:var(--tx)}.tm>input:first-child{border-left:5px solid var(--c);font-weight:700}
.cvr{position:absolute;inset:0;pointer-events:auto;background:#0b1824}.cvr img{width:100%;height:100%;object-fit:contain}.cvr .go{position:absolute;bottom:12px;left:0;right:0;margin:auto;width:max-content;animation:p 1s infinite;box-shadow:0 4px 14px #0009}
.go{border:0;background:#f4a100;color:#fff;font-weight:800;font-size:18px;padding:10px 22px;border-radius:12px}
#skp{position:absolute;right:8px;bottom:8px;display:none;border:0;border-radius:18px;padding:8px 14px;background:#000a;color:#fff;font-size:14px;font-weight:700;z-index:2}
#ct{position:absolute;top:18%;left:0;right:0;text-align:center;font-size:72px;font-weight:900;color:#fff;text-shadow:0 4px 12px #0009;pointer-events:none}
#ui{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;background:var(--bg)}
.card{background:var(--card);color:var(--tx);border-radius:12px;border-top:5px solid var(--c);padding:6px 7px;min-height:168px;display:flex;flex-direction:column}
.hd{display:flex;justify-content:space-between;font-size:13px}
.bar{height:6px;background:var(--opt);border-radius:4px;margin:4px 0 6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--c)}
.bd{flex:1;display:flex;flex-direction:column;justify-content:center}
.who{font-size:11px;color:var(--mut);margin-bottom:2px;font-weight:600}
.qi{display:block;max-width:100%;max-height:64px;object-fit:contain;margin:0 auto 4px;border-radius:6px}
.mr{display:flex;gap:4px;align-items:center;margin:2px 0}.mr input{width:auto!important;flex:1;min-width:0;margin:0!important}
.gd{width:30px;height:30px;flex:none;border:0;border-radius:50%;font-size:19px;font-weight:800;color:#fff;background:#1d6fe0;line-height:30px;padding:0;cursor:pointer}.gd[data-g=P]{background:#e8559a}
.gh{font-size:11px;color:var(--mut);margin:0 0 8px}
.sl{display:block;text-align:left;font-size:12px;font-weight:700;margin:6px 0 2px;color:var(--tx)}.box select{width:100%;padding:7px;border-radius:8px;border:1px solid var(--opt);background:var(--opt);color:var(--tx);font-size:14px}
#err{color:#e03131;font-size:12px;font-weight:600;margin:6px 0 0;min-height:0}.go:disabled{opacity:.6}
.cur{position:absolute;inset:0;z-index:5;pointer-events:auto;overflow:hidden;cursor:pointer}.cur.open{pointer-events:none}
.cur .pn{position:absolute;top:0;bottom:0;width:50.4%;background:repeating-linear-gradient(90deg,#6e0c17 0,#b8212f 16px,#8a1220 30px,#56090f 44px);box-shadow:inset 0 0 50px #000a;transition:transform 2.2s cubic-bezier(.7,0,.3,1)}
.cur .l{left:0;transform-origin:left center;border-right:2px solid #d9a441}.cur .r{right:0;transform-origin:right center;border-left:2px solid #d9a441}
.cur.open .pn{transform:scaleX(.13)}
.cur .vl{position:absolute;top:0;left:0;right:0;height:38px;z-index:3;background:linear-gradient(#35050a,#8f1624);border-bottom:4px solid #d9a441;box-shadow:0 4px 12px #0009;transition:opacity 1s 1.4s}
.cur.open .vl{opacity:0}
.cur .ct2{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);text-align:center;color:#fff;z-index:2;text-shadow:0 2px 8px #000c;transition:opacity .5s}
.cur.open .ct2{opacity:0}
.cur .ct2 b{display:block;font-size:24px;font-weight:800;margin:6px 0 14px}
.q{font-size:13px;font-weight:700;margin-bottom:3px;line-height:1.25}
.op{text-align:left;border:0;background:var(--opt);color:var(--tx);font-size:13px;padding:6px 8px;margin:2px 0;border-radius:8px}
.op.sel{background:#f4a100;color:#fff}.op:disabled{opacity:.55}.rd{font-size:11px;font-weight:700;color:#f4a100;margin-bottom:2px}.op.ok{background:#2fb344;color:#fff}.op.bad{background:#e03131;color:#fff}
.tap{border:0;background:var(--c);color:#fff;font-size:30px;font-weight:900;height:100px;border-radius:14px;animation:p 1s infinite}
.tap small{display:block;font-size:11px;font-weight:600;opacity:.9}
.msg{text-align:center;font-size:13px;font-weight:600}
@keyframes p{50%{transform:scale(.95)}}
</style></head><body>
